spring.application.name=AppVentas

spring.datasource.url=jdbc:mysql://localhost:3306/ventas
spring.datasource.username=root
spring.datasource.password=

# La captura de la guía dice spring.jpa.show=true: esa propiedad no existe y Spring la ignora.
# La correcta para ver el SQL en consola es show-sql
spring.jpa.show-sql=true

# Muestra el mensaje de error (404, 409...) en el JSON de respuesta
spring.web.error.include-message=always
