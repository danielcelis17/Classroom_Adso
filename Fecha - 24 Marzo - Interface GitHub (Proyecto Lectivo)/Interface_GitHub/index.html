<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deliweb - Pastelería y Repostería</title>
    <!-- Hoja de estilos principal -->
    <link rel="stylesheet" href="css/styles.css">
    <!-- Fuente desde Google Fonts (ejemplo, ajustar según la fuente de Figma) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Encabezado / Header -->
    <header class="header">
        <div class="container header-container">
            <a href="#" class="logo">
                <img src="assets/img/logo.png" alt="Deliweb Logo">
            </a>
            <nav class="nav">
                <ul class="nav-list">
                    <li><a href="#inicio">Inicio</a></li>
                    <li><a href="#productos">Productos</a></li>
                    <li><a href="#nosotros">Nosotros</a></li>
                    <li><a href="#contacto">Contacto</a></li>
                </ul>
            </nav>
            <div class="header-actions">
                <button class="btn-cart" id="cart-btn">🛒 <span id="cart-count">0</span></button>
            </div>
        </div>
    </header>

    <!-- Sección Principal / Hero -->
    <main>
        <section id="inicio" class="hero">
            <div class="container hero-container">
                <div class="hero-text">
                    <h1>Los mejores postres a un clic de distancia</h1>
                    <p>Encuentra tus pasteles y postres favoritos preparados con la mejor calidad.</p>
                    <a href="#productos" class="btn btn-primary">Ver Productos</a>
                </div>
                <div class="hero-image">
                    <img src="assets/img/hero-dessert.png" alt="Postre Deliweb">
                </div>
            </div>
        </section>
    </main>

    <!-- Script JavaScript -->
    <script src="js/main.js"></script>
</body>
</html>
